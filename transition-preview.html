<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Life Quote has moved</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-qq-32.png" />
<script>
(() => {
  if (window.location.hostname === 'bbuisson188.github.io') {
    // Only remove this app's data; GitHub Pages storage is shared with other repos.
    try {
      for (let index = localStorage.length - 1; index >= 0; index -= 1) {
        const key = localStorage.key(index);
        if (/^(?:life-quote-history(?:-v\d+|-migrated-v\d+)?|new-business-quote-history(?:-v\d+)?)$/i.test(key || '')) {
          localStorage.removeItem(key);
        }
      }
    } catch (error) {
      console.warn('Old Life Quote saved data could not be cleared.', error);
    }
    try {
      sessionStorage.removeItem('life-quote-year-projection');
    } catch (error) {
      console.warn('Old Life Quote projection could not be cleared.', error);
    }
  }
  const destination = new URL('/', 'https://lifequote-d33.pages.dev');
  destination.search = window.location.search;
  if (window.location.hash.startsWith('#share=')) destination.hash = window.location.hash;
  window.location.replace(destination.href);
})();
</script>
</head>
<body>
<p>Life Quote has moved. <a href="https://lifequote-d33.pages.dev/">Open Life Quote</a>.</p>
</body>
</html>
